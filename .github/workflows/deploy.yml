name: 🚀 Deploy to cPanel (Node.js App)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy & Restart App
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 📝 Create env file
        run: |
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY="AIzaSyCwik4s19juSR8BBW7MzuHyXbE38kYZvZA"
          VITE_FIREBASE_AUTH_DOMAIN="bontes-cmr.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID="bontes-cmr"
          VITE_FIREBASE_STORAGE_BUCKET="bontes-cmr.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID="551504920212"
          VITE_FIREBASE_APP_ID="1:551504920212:web:b1ae7ba9fda97f34877e81"
          VITE_FIREBASE_MEASUREMENT_ID="G-V0ZT2S6SRG"
          
          VITE_EMAILJS_SERVICE_ID="service_6cz93w9"
          VITE_EMAILJS_TEMPLATE_ID="template_3ucokpm"
          VITE_EMAILJS_PUBLIC_KEY="_AYCd29TknHVK3c-s"
          EOF

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🔄 Create Passenger Restart File
        run: |
          mkdir -p dist/tmp
          touch dist/tmp/restart.txt

      - name: 📂 Sync files to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          exclude: |
            **/.git*
            **/.git*/**


# Trigger deploy: v1.0.2
